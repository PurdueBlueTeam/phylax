{{define "base.html"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles":false,"allowEval":false,"allowScriptTags":false,"selfRequestsOnly":true}'>
<title>{{.Title}} - Phylax</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/htmx.min.js"></script>
</head>
<body hx-headers='{{.HXHeaders}}'>
{{if .User}}<header class="top">
<strong>Phylax</strong>
<nav>
<a href="/"{{if eq .Nav "dashboard"}} aria-current="page"{{end}}>Dashboard</a>
<a href="/agents"{{if eq .Nav "agents"}} aria-current="page"{{end}}>Agents</a>
<a href="/alerts"{{if eq .Nav "alerts"}} aria-current="page"{{end}}>Alerts</a>
<a href="/plans"{{if eq .Nav "plans"}} aria-current="page"{{end}}>Plans</a>
<a href="/enroll"{{if eq .Nav "enroll"}} aria-current="page"{{end}}>Enroll</a>
<a href="/proposals"{{if eq .Nav "proposals"}} aria-current="page"{{end}}>Proposals</a>
<a href="/chains"{{if eq .Nav "chains"}} aria-current="page"{{end}}>Chains</a>
<a href="/reports"{{if eq .Nav "reports"}} aria-current="page"{{end}}>Reports</a>
<a href="/checks"{{if eq .Nav "checks"}} aria-current="page"{{end}}>Checks</a>
<a href="/health"{{if eq .Nav "health"}} aria-current="page"{{end}}>Health</a>
<a href="/audit"{{if eq .Nav "audit"}} aria-current="page"{{end}}>Audit</a>
<a href="/account"{{if eq .Nav "account"}} aria-current="page"{{end}}>Account</a>
</nav>
<form method="post" action="/logout" class="inline"><input type="hidden" name="csrf_token" value="{{.CSRF}}"><span class="user">{{.User}}</span> <button type="submit">Sign out</button></form>
</header>{{end}}
<main>
{{if .Error}}<p class="error" role="alert">{{.Error}}</p>{{end}}
{{if .Notice}}<p class="notice" role="status">{{.Notice}}</p>{{end}}
{{template "content" .}}
</main>
</body>
</html>{{end}}
