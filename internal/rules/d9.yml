# D9: lateral movement and remote admin — admin logons from undeclared
# sources, admin-share access, remote service creation, PsExec pipes.
id: D9.lateral-movement
when:
  event: sec_event
  any:
    - all:
        - event_id: 4624
        - logon_type: [3, 10]
        - source: {not: {re: "^(controller|127\\.0\\.0\\.1|::1)$"}}
    - all:
        - event_id: 5140
        - share: {re: "(?i)^(admin\\$|c\\$|ipc\\$)$"}
    - all:
        - event_id: 4697
        - service: {re: ".+"}
    - all:
        - event_id: 17
        - pipe: {re: "(?i)psexec"}
severity: high
tier: 1
collect: [process_tree]
attack: [T1021.002, T1021.006, T1021.001, T1071]
test: D9
