# D8: credential theft — DCSync, LSASS reads, AS-REP roastable TGTs,
# RC4 service tickets, hive dumps. Local equivalent: security-event
# shaped events (event 4662 with replication rights = DCSync).
id: D8.credential-theft
when:
  event: sec_event
  any:
    - all:
        - event_id: 4662
        - rights: {re: "Replication"}
        - account: {not: {re: "^DC-"}}
    - all:
        - event_id: 4768
        - ticket_options: {re: "0x0010000000000000"}
    - all:
        - event_id: 4769
        - enc: [rc4, rc4-hmac]
    - all:
        - event_id: 4657
        - object: {re: "(?i)system|sam|ntds"}
severity: critical
tier: 1
collect: [process_tree, content_changes]
attack: [T1003.006, T1003.001, T1558.004, T1558.003]
test: D8
