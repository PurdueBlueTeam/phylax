# D12: denied outbound attempt from a server process. Periodic attempts
# (3+ in 60s) escalate: that is a beacon retrying.
id: D12.denied-egress
when:
  event: denied_egress
  all:
    - not: {tag: {re: ".+"}}
  count:
    window: 60s
    gte: 1
severity: high
tier: 1
collect: [process_tree, content_changes]
attack: [T1071, T1572]
test: D12
