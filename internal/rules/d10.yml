# D10: defense evasion — logs cleared, firewall changed or disabled.
# Tier 0: restore the declared state (firewall policy, audit rules,
# collection); tier 1 on the trigger lineage.
id: D10.defense-evasion
when:
  event: log_cleared
  all:
    - file: {re: ".+"}
severity: critical
tier: 0
collect: [process_tree, content_changes]
attack: [T1070.004, T1562.001]
test: D10
