name: ci

on:
  push:
    branches: [main, v3]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Static build (linux, windows)
        run: make build build-windows
      - name: Size gate (40 MB / 15 MB gz)
        run: make size
      - name: Vet (linux, windows)
        run: make vet
      - name: Tests
        run: go test ./...
      - name: Race
        run: go test -race ./...
