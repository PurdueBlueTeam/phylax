id: D10c.defender-tamper
title: Defender protection disabled or an exclusion added
severity: critical
tier: 0
attack: [T1685]
collect: [process_tree, registry_snapshot]
exempt_tagged: true
when:
  event: sec_event
  all:
    - category: defender_tamper
  any:
    - tamper: [realtime_disabled, realtime_config_changed, scanning_disabled, scanning_virus_disabled]
    - all:
        - tamper: config_changed
        - defender_exclusion: true
        - not: {new_value: {re: '(?i)Exclusions\\Paths\\[A-Z]:\\(ProgramData\\phylax|Program Files\\phylax)'}}
tests:
  - {name: realtime off, should_match: true, event: {kind: sec_event, fields: {category: defender_tamper, event_id: 5001, tamper: realtime_disabled}}}
  - {name: exclusion added, should_match: true, event: {kind: sec_event, fields: {category: defender_tamper, event_id: 5007, tamper: config_changed, defender_exclusion: true, new_value: 'HKLM\SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths\C:\Temp = 0x0'}}}
  - {name: our exclusion, should_match: false, event: {kind: sec_event, fields: {category: defender_tamper, event_id: 5007, tamper: config_changed, defender_exclusion: true, new_value: 'HKLM\SOFTWARE\Microsoft\Windows Defender\Exclusions\Paths\C:\ProgramData\phylax = 0x0'}}}
  - {name: unrelated config change, should_match: false, event: {kind: sec_event, fields: {category: defender_tamper, event_id: 5007, tamper: config_changed, defender_exclusion: false}}}
