tests:
  - {name: Run key, should_match: true, event: {kind: sec_event, fields: {event_id: 13, target_object: 'HKU\S-1-5\Software\Microsoft\Windows\CurrentVersion\Run\updater'}}}
  - {name: unrelated key, should_match: false, event: {kind: sec_event, fields: {event_id: 13, target_object: 'HKU\S-1-5\Software\Foo\Bar'}}}
  - {name: tagged, should_match: false, event: {kind: sec_event, fields: {event_id: 13, target_object: 'HKLM\Software\Microsoft\Windows\CurrentVersion\Run\phylax', tag: "plan:install"}}}
