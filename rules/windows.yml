id: D10k2.fw-tamper-win
title: Windows firewall disabled or rules changed by netsh/PowerShell
severity: high
tier: 1
attack: [T1686]
collect: [process_tree, content_changes]
exempt_tagged: true
when:
  event: process_start
  any:
    - all:
        - comm: netsh.exe
        - cmdline: {re: '(?i)(advfirewall\s+set\s+\S+\s+state\s+off|firewall\s+set\s+opmode\s+mode=disable|advfirewall\s+firewall\s+(delete|add|set)\s+rule)'}
    - all:
        - comm: {re: '(?i)^(powershell|pwsh)\.exe$'}
        - cmdline: {re: '(?i)Set-NetFirewallProfile.*-Enabled\s+(False|0)|netsh\s+advfirewall'}
tests:
  - {name: firewall off, should_match: true, event: {kind: process_start, fields: {comm: netsh.exe, cmdline: 'netsh advfirewall set allprofiles state off'}}}
  - {name: powershell, should_match: true, event: {kind: process_start, fields: {comm: powershell.exe, cmdline: 'powershell Set-NetFirewallProfile -Profile Domain -Enabled False'}}}
  - {name: our restore is tagged, should_match: false, event: {kind: process_start, fields: {comm: netsh.exe, cmdline: 'netsh advfirewall set allprofiles state off', tag: "plan:fw"}}}
  - {name: show, should_match: false, event: {kind: process_start, fields: {comm: netsh.exe, cmdline: 'netsh advfirewall show allprofiles'}}}
