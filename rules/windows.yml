id: D8c.lsass-access
title: Process opened lsass.exe with memory-read rights from a non-allow-listed image
severity: critical
tier: 1
attack: [T1003.001]
collect: [process_tree, memory_artifacts]
entities: [source_image]
when:
  event: sec_event
  all:
    - category: process_access
    - target_lsass: true
    - granted_access: {re: '(?i)^0x(1038|1438|143a|1fffff|1f3fff|1f1fff|1010|1410|40)$'}
    - not: {source_image: {re: '(?i)\\(MsMpEng|MpDefenderCoreService|csrss|wininit|services|svchost|lsm|taskmgr|vmtoolsd|VBoxService|wmiprvse|Sysmon64?|phylax)(\.exe)?$'}}
tests:
  - {name: mimikatz, should_match: true, event: {kind: sec_event, fields: {category: process_access, target_lsass: true, granted_access: "0x1010", source_image: 'C:\Users\x\m.exe'}}}
  - {name: defender, should_match: false, event: {kind: sec_event, fields: {category: process_access, target_lsass: true, granted_access: "0x1010", source_image: 'C:\ProgramData\Microsoft\Windows Defender\Platform\4.18\MsMpEng.exe'}}}
  - {name: other target, should_match: false, event: {kind: sec_event, fields: {category: process_access, target_lsass: false, granted_access: "0x1010", source_image: 'C:\x.exe'}}}
---
id: D8h.hive-ntds-dump-exec
title: Command line dumping registry hives, NTDS.dit or shadow-copy credential files
severity: critical
tier: 1
attack: [T1003.002, T1003.003]
collect: [process_tree, content_changes]
exempt_tagged: true
when:
  event: process_start
  any:
    - all:
        - comm: reg.exe
        - cmdline: {re: '(?i)\s(save|export)\s.*(hklm|hkey_local_machine)\\(sam|security|system)'}
    - all:
        - comm: {re: '(?i)^(ntdsutil|wbadmin|esentutl|diskshadow|vssadmin|wmic|powershell|pwsh)\.exe$'}
        - cmdline: {re: '(?i)(ntds\.dit|ac i ntds|ifm|create full|get-?versions?.*(sam|ntds)|shadowcopy.*(create|call)|ntdsutil.*activate instance|\\config\\(sam|security|system))'}
tests:
  - {name: reg save sam, should_match: true, event: {kind: process_start, fields: {comm: reg.exe, cmdline: 'reg save HKLM\SAM C:\x\sam.hiv'}}}
  - {name: ntdsutil ifm, should_match: true, event: {kind: process_start, fields: {comm: ntdsutil.exe, cmdline: 'ntdsutil "ac i ntds" ifm "create full c:\x" q q'}}}
  - {name: reg query, should_match: false, event: {kind: process_start, fields: {comm: reg.exe, cmdline: 'reg query HKLM\Software\Foo'}}}
---
id: D13b.c2-pipes
title: Default C2 or PsExec named pipe
description: ntsvcs/svcctl are normal Windows pipes and are deliberately not listed.
severity: critical
tier: 1
attack: [T1071, T1021.002, T1055]
collect: [process_tree]
when:
  event: sec_event
  all:
    - event_id: [17, 18]
    - pipe_name: {re: '(?i)^\\(MSSE-[0-9a-f]+-server$|postex_|status_[0-9a-f]|msagent_|mojo_|interprocess_|samr_|netlogon_|srvsvc_|lsarpc_|wkssvc_|csexecsvc$|gruntsvc$|Posh|jaccdpqnvbrrxlaf$|PSEXESVC$|RemCom_communic)'}
tests:
  - {name: cobalt strike msse, should_match: true, event: {kind: sec_event, fields: {event_id: 17, category: pipe, pipe_name: '\MSSE-1234-server'}}}
  - {name: psexec, should_match: true, event: {kind: sec_event, fields: {event_id: 18, category: pipe, pipe_name: '\PSEXESVC'}}}
  - {name: svcctl is normal, should_match: false, event: {kind: sec_event, fields: {event_id: 17, category: pipe, pipe_name: '\svcctl'}}}
---
id: D10j2.timestomp-win
title: Sysmon file-creation-time change by an unusual process
severity: low
tier: 1
attack: [T1070.006]
collect: [process_tree]
when:
  event: sec_event
  all:
    - event_id: 2
    - not: {exe: {re: '(?i)\\(OneDrive|Teams|msiexec|TiWorker|MsMpEng|svchost)\.exe$'}}
tests:
  - {name: timestomp by a dropper, should_match: true, event: {kind: sec_event, fields: {event_id: 2, category: file_time_changed, exe: 'C:\Users\x\a.exe', path: 'C:\x\y.dll'}}}
  - {name: msiexec, should_match: false, event: {kind: sec_event, fields: {event_id: 2, exe: 'C:\Windows\System32\msiexec.exe'}}}
