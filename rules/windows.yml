id: D3c2.remote-access-inventory-win
title: Remote-access or tunnelling tool started on Windows
severity: high
tier: 1
attack: [T1219, T1202, T1572]
collect: [process_tree]
exempt_tagged: true
when:
  event: process_start
  all:
    - comm: {re: '(?i)^(tailscale(-ipn)?|ngrok|chisel|frpc|ligolo.*|cloudflared|teamviewer|anydesk|rustdesk|winvnc|tvnserver|vncserver|wsl|wslhost|bash|sshd|ssh-agent|screenconnect.*|choco)\.exe$'}
tests:
  - {name: ngrok, should_match: true, event: {kind: process_start, fields: {comm: ngrok.exe, exe: 'C:\Users\x\ngrok.exe'}}}
  - {name: notepad, should_match: false, event: {kind: process_start, fields: {comm: notepad.exe}}}
