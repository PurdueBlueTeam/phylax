id: D1g.windows-service-child
title: IIS/DNS/FTP/SQL service process spawned a shell or recon tool
severity: high
tier: 1
attack: [T1505.003, T1059, T1543.003]
collect: [process_tree, content_changes, freeze_ring]
exempt_tagged: true
when:
  event: process_start
  all:
    - parent.comm: {re: '(?i)^(w3wp|dns|ftpsvc|inetinfo|sqlservr|msftpsvc|splunkd)\.exe$'}
    - comm: {re: '(?i)^(cmd|powershell|pwsh|wscript|cscript|mshta|rundll32|regsvr32|certutil|bitsadmin|whoami|net1?|nltest|wmic|curl|schtasks|sc|reg|ipconfig|systeminfo|tasklist|netstat|nslookup|arp)\.exe$'}
tests:
  - {name: w3wp cmd, should_match: true, event: {kind: process_start, fields: {comm: cmd.exe, pcomm: w3wp.exe}}}
  - {name: sqlservr whoami nested parent, should_match: true, event: {kind: process_start, fields: {comm: whoami.exe, parent: {comm: sqlservr.exe}}}}
  - {name: w3wp spawns itself, should_match: false, event: {kind: process_start, fields: {comm: w3wp.exe, pcomm: w3wp.exe}}}
  - {name: explorer cmd, should_match: false, event: {kind: process_start, fields: {comm: cmd.exe, pcomm: explorer.exe}}}
