id: D6q.task-content
title: Scheduled task running from a user-writable path or LOLBin, or a non-stock task under \Microsoft\
severity: high
tier: 0
attack: [T1053.005]
collect: [process_tree, content_changes]
exempt_tagged: true
entities: [task_name, subject_account]
when:
  event: sec_event
  all:
    - event_id: [4698, 4702, 106, 140]
  any:
    - task_content: {re: '(?i)(\\AppData\\|\\Users\\Public\\|\\Windows\\Temp\\|C:\\Temp\\|C:\\ProgramData\\|C:\\PerfLogs\\|regsvr32|rundll32|mshta|wscript|cscript|certutil|powershell|pwsh|<Arguments>/[ckr] |cmd(\.exe)?</Command>|bitsadmin|curl|\.vbs|\.hta)'}
    - all:
        - task_name: {re: '^\\Microsoft\\'}
        - not: {task_name: {in_profile: reference.windows_tasks}}
tests:
  - {name: powershell task, should_match: true, event: {kind: sec_event, fields: {event_id: 4698, task_content: '<Exec><Command>powershell.exe</Command></Exec>'}}}
  - name: non-stock Microsoft task
    should_match: true
    seed: {reference.windows_tasks: ['\Microsoft\Windows\Defrag\ScheduledDefrag']}
    event: {kind: sec_event, fields: {event_id: 106, task_name: '\Microsoft\Windows\Updater'}}
  - name: stock task
    should_match: false
    seed: {reference.windows_tasks: ['\Microsoft\Windows\Defrag\ScheduledDefrag']}
    event: {kind: sec_event, fields: {event_id: 106, task_name: '\Microsoft\Windows\Defrag\ScheduledDefrag'}}
  - {name: benign task, should_match: false, event: {kind: sec_event, fields: {event_id: 4698, task_content: '<Exec><Command>C:\Program Files\App\run.exe</Command></Exec>'}}}
