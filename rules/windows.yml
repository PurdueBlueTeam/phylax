  - {name: machine account SPN, should_match: false, event: {kind: sec_event, fields: {channel: Security, event_id: 4769, status: "0x0", rc4_ticket: true, service_name: 'HOST$', target_user_name: 'bob@CORP'}}}
  - {name: AES ticket, should_match: false, event: {kind: sec_event, fields: {channel: Security, event_id: 4769, status: "0x0", rc4_ticket: false, service_name: MSSQLSvc}}}
