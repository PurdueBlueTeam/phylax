id: D6g.service-install-suspicious
title: Service installed with a suspicious image path or outside trusted install paths
severity: high
tier: 1
attack: [T1543.003, T1569.002, T1021.002]
collect: [process_tree, content_changes]
exempt_tagged: true
entities: [service_name, image_path]
when:
  event: sec_event
  all:
    - event_id: [7045, 4697]
  any:
    - image_path: {re: '(?i)(%comspec%|cmd(\.exe)?"?\s+/[ckr]|powershell|pwsh|mshta|wscript|cscript|rundll32\s|regsvr32|\\\\\.\\pipe|\\Users\\|\\Temp\\|\\ProgramData\\|\\PerfLogs\\|\.(bat|vbs|ps1)\b)'}
    - service_name: {re: '(?i)^(sliver|psexesvc|remcom|csexec|paexec)'}
    - not: {image_path: {re: '(?i)^"?[A-Z]:\\(Windows|Program Files|Program Files \(x86\))\\'}}
tests:
  - {name: PSEXESVC, should_match: true, event: {kind: sec_event, fields: {event_id: 7045, service_name: PSEXESVC, image_path: 'C:\Windows\PSEXESVC.exe'}}}
  - {name: temp path, should_match: true, event: {kind: sec_event, fields: {event_id: 7045, service_name: x, image_path: 'C:\Windows\Temp\a.exe'}}}
  - {name: stock service, should_match: false, event: {kind: sec_event, fields: {event_id: 7045, service_name: Spooler, image_path: 'C:\Windows\System32\spoolsv.exe'}}}
  - {name: our install is tagged, should_match: false, event: {kind: sec_event, fields: {event_id: 7045, service_name: Phylax, image_path: 'D:\phylax\phylax.exe', tag: "plan:install"}}}
