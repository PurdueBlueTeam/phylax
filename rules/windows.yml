id: D8d.ad-object-change
title: AD object change implementing delegation, SID-history, key-credential or GPO backdoors
severity: high
tier: 1
attack: [T1098, T1484.001, T1207, T1550]
collect: [process_tree, ad_snapshot]
exempt_tagged: true
when:
  event: sec_event
  any:
    - all:
        - event_id: 5136
        - attribute: [msDS-AllowedToActOnBehalfOfOtherIdentity, msDS-AllowedToDelegateTo, msDS-KeyCredentialLink, sIDHistory, dSHeuristics, gPLink, gPCMachineExtensionNames, gPCUserExtensionNames, scriptPath]
    - all:
        - event_id: 5136
        - object_class: user
        - attribute: servicePrincipalName
    - all:
        - event_id: 5137
        - object_class: groupPolicyContainer
    - all:
        - event_id: [4739, 4742]
        - allowed_to_delegate_to: {present: true}
tests:
  - {name: gPLink changed, should_match: true, event: {kind: sec_event, fields: {event_id: 5136, category: ad_object_change, attribute: gPLink, object_class: organizationalUnit}}}
  - {name: SPN on user, should_match: true, event: {kind: sec_event, fields: {event_id: 5136, attribute: servicePrincipalName, object_class: user}}}
  - {name: description edit, should_match: false, event: {kind: sec_event, fields: {event_id: 5136, attribute: description, object_class: user}}}
