id: D10d.audit-policy-and-log-clear
title: Event log cleared or audit sub-categories turned off
severity: critical
tier: 0
attack: [T1685.005, T1685.001]
collect: [process_tree, content_changes]
exempt_tagged: true
when:
  event: sec_event
  any:
    - event_id: [1102, 104]
    - all:
        - event_id: 4719
        - any:
            - changes: {re: '%%(8448|8450)'}
            - audit_policy_changes: {re: '%%(8448|8450)'}
tests:
  - {name: security log cleared, should_match: true, event: {kind: sec_event, fields: {event_id: 1102, category: log_cleared}}}
  - {name: audit success removed, should_match: true, event: {kind: sec_event, fields: {event_id: 4719, changes: '%%8448'}}}
  - {name: our auditpol is tagged, should_match: false, event: {kind: sec_event, fields: {event_id: 4719, changes: '%%8448', tag: "plan:audit"}}}
  - {name: audit added, should_match: false, event: {kind: sec_event, fields: {event_id: 4719, changes: '%%8449'}}}
---
id: D10e.sysmon-tamper
title: Sysmon stopped or reconfigured outside a plan
severity: critical
tier: 0
attack: [T1685]
collect: [process_tree]
exempt_tagged: true
when:
  event: sec_event
  any:
    - all:
        - event_id: 4
        - state: Stopped
    - event_id: 16
tests:
  - {name: sysmon stopped, should_match: true, event: {kind: sec_event, fields: {event_id: 4, category: sysmon_state, state: Stopped}}}
  - {name: config change, should_match: true, event: {kind: sec_event, fields: {event_id: 16, category: sysmon_config}}}
  - {name: our reconfigure is tagged, should_match: false, event: {kind: sec_event, fields: {event_id: 16, tag: "plan:sysmon"}}}
  - {name: started, should_match: false, event: {kind: sec_event, fields: {event_id: 4, state: Started}}}
