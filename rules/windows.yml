# Windows rules (producer: internal/collect/winevt). Kinds: process_start (Sysmon 1 / 4688),
# file_change (Sysmon 11/23), net_connect, auth_*, and sec_event for everything
# else with channel, provider, event_id, category and the raw snake_case
# EventData keys. Fields used here: exe/image, comm, cmdline, pexe/parent.*,
# category, target_object, details, pipe_name, source_image, target_image, ...
id: D7c.windows-account-event
title: Account created, enabled, reset, changed or added to a privileged group outside a plan
severity: high
tier: 1
attack: [T1136.001, T1136.002, T1098]
collect: [process_tree]
exempt_tagged: true
entities: [account, subject_account]
when:
  event: sec_event
  all:
    - channel: Security
    - event_id: [4720, 4722, 4724, 4728, 4732, 4738, 4756, 4781]
tests:
  - {name: account created, should_match: true, event: {kind: sec_event, fields: {channel: Security, event_id: 4720, account: backdoor$x, subject_account: CORP\azul}}}
  - {name: other security event, should_match: false, event: {kind: sec_event, fields: {channel: Security, event_id: 4624}}}
  - {name: our plan, should_match: false, event: {kind: sec_event, fields: {channel: Security, event_id: 4724, tag: "plan:rotate"}}}
---
id: D7e.hidden-dollar-account
title: User account created or renamed with a trailing dollar sign
severity: high
tier: 1
attack: [T1136.001, T1564.002]
collect: [process_tree]
exempt_tagged: true
when:
  event: sec_event
  all:
    - channel: Security
  any:
    - all:
        - event_id: 4720
        - target_user_name: {re: '\$$'}
        - not: {target_user_name: HomeGroupUser$}
    - all:
        - event_id: 4781
        - new_target_user_name: {re: '\$$'}
tests:
  - {name: hidden account, should_match: true, event: {kind: sec_event, fields: {channel: Security, event_id: 4720, target_user_name: svc_sql$}}}
  - {name: renamed to hidden, should_match: true, event: {kind: sec_event, fields: {channel: Security, event_id: 4781, new_target_user_name: Guest$}}}
  - {name: normal user, should_match: false, event: {kind: sec_event, fields: {channel: Security, event_id: 4720, target_user_name: alice}}}
  - {name: HomeGroupUser, should_match: false, event: {kind: sec_event, fields: {channel: Security, event_id: 4720, target_user_name: HomeGroupUser$}}}
---
id: D8b.zerologon
title: Zerologon signal on the DC (vulnerable Netlogon channel or anonymous machine-account change)
severity: critical
tier: 1
attack: [T1210, T1068]
collect: [process_tree, auth_window_10m]
ir_template: dc-compromise
when:
  event: sec_event
  all:
    - zerologon_signal: {present: true}
tests:
  - {name: 5829 vulnerable connection, should_match: true, event: {kind: sec_event, fields: {channel: System, event_id: 5829, zerologon_signal: 5829_vulnerable_allowed}}}
  - {name: 4742 by anonymous, should_match: true, event: {kind: sec_event, fields: {channel: Security, event_id: 4742, zerologon_signal: 4742_anonymous}}}
  - {name: normal 4742, should_match: false, event: {kind: sec_event, fields: {channel: Security, event_id: 4742}}}
