id: D5g.trolling-payload-shape
title: Prank payload command line (cursor pinning, pop-up spam, nyancat, screen/terminal inversion)
description: Foothold evidence rather than damage; severity low. Shape-based on the APIs and escape codes the pranks need, not on tool names alone.
severity: low
tier: 1
attack: [T1491.001, T1204]
collect: [process_tree]
exempt_tagged: true
entities: [exe, user]
message: "{cmdline}"
when:
  event: process_start
  any:
    - cmdline: {re: '(?i)(\[(System\.)?Windows\.Forms\.Cursor\]::(Position|Clip)|SetCursorPos|ClipCursor|mouse_event|WScript\.Shell.*\.Popup\(|\bmsg(\.exe)?\s+(\*|/server)|mousejail|oathkeeper|SwapMouseButton|BlockInput)'}
    - cmdline: {re: '(?i)(nyancat|nyan\.cat|nyan-cat|towel\.blinkenlights\.nl|dvd[-_ ]?logo|bouncing[-_ ]?logo)'}
    - cmdline: {re: '(\\e\[\?5h|\\033\[\?5h|\\x1b\[\?5h|setterm\s+--(reverse|inversescreen)|tput\s+(rev|smso)\b.*while|xrandr\s.*--rotate\s+(inverted|left|right)|xdotool\s+mousemove|\beject\b.*(-T|trap))'}
tests:
  - {name: powershell cursor pin, should_match: true, event: {kind: process_start, fields: {image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe', cmdline: 'powershell -w hidden -c "while(1){[Windows.Forms.Cursor]::Position=New-Object Drawing.Point(5,5)}"'}}}
  - {name: msg broadcast, should_match: true, event: {kind: process_start, fields: {cmdline: 'msg * you have been hacked'}}}
  - {name: nyancat in a terminal, should_match: true, event: {kind: process_start, fields: {cmdline: 'nyancat -f 100'}}}
  - {name: telnet nyancat, should_match: true, event: {kind: process_start, fields: {cmdline: 'telnet towel.blinkenlights.nl'}}}
  - {name: terminal inversion loop, should_match: true, event: {kind: process_start, fields: {cmdline: "bash -c 'while true; do printf \"\\e[?5h\"; sleep 1; done'"}}}
  - {name: display flipped, should_match: true, event: {kind: process_start, fields: {cmdline: 'xrandr --output HDMI-1 --rotate inverted'}}}
  - {name: ordinary shell, should_match: false, event: {kind: process_start, fields: {cmdline: 'powershell -c Get-Service'}}}
  - {name: git message, should_match: false, event: {kind: process_start, fields: {cmdline: 'git commit -m message-about-cats'}}}
  - {name: our own plan, should_match: false, event: {kind: process_start, fields: {cmdline: 'msg * maintenance in 5 minutes', tag: 'plan:notify'}}}
---
id: D9f.reverse-tunnel-unit
title: SSH reverse tunnel (-R / RemoteForward), especially persistent (-N, -f, autossh or a service)
description: >
  Shape: an ssh or autossh process with a remote-forward spec in any flag form (-R 8443:localhost:80,
  -fNR..., -R8443:..., -o RemoteForward=...). The same command line is what a systemd unit's
  ExecStart executes, so the unit variant is caught when it runs. -L and -D forwards are not matched.
severity: high
tier: 1
attack: [T1572, T1090]
collect: [process_tree, freeze_ring]
exempt_tagged: true
entities: [exe, uid]
message: "{cmdline}"
when:
  event: process_start
  all:
    - cmdline: {re: '(^|[/\s])(auto)?ssh(\s|$)'}
    - any:
        - cmdline: {re: '\s-[A-Za-z]*R\s*(\[?[A-Za-z0-9_.:*-]+\]?:)?\d+(:[A-Za-z0-9_.\[\]:-]+:\d+)?(\s|$)'}
        - cmdline: {re: '(?i)\s-o\s*RemoteForward[= ]'}
        - cmdline: {re: '(?i)\sRemoteForward[= ]\S'}
tests:
  - {name: gaia redirector unit, should_match: true, event: {kind: process_start, fields: {cmdline: '/usr/bin/ssh -o ServerAliveInterval=30 -o StrictHostKeyChecking=no -N -f -R 8443:localhost:80 -i /root/.ssh/k user@teamserver'}}}
  - {name: combined flags, should_match: true, event: {kind: process_start, fields: {cmdline: 'ssh -fNR 9001:127.0.0.1:22 u@h'}}}
  - {name: no space after -R, should_match: true, event: {kind: process_start, fields: {cmdline: 'ssh -R8443:localhost:80 u@h'}}}
  - {name: bind address form, should_match: true, event: {kind: process_start, fields: {cmdline: 'autossh -M 0 -R 0.0.0.0:2222:localhost:22 u@h'}}}
  - {name: option form, should_match: true, event: {kind: process_start, fields: {cmdline: 'ssh -o RemoteForward=8443:localhost:80 u@h'}}}
  - {name: plain login, should_match: false, event: {kind: process_start, fields: {cmdline: 'ssh -i key admin@10.0.0.5'}}}
  - {name: local forward, should_match: false, event: {kind: process_start, fields: {cmdline: 'ssh -N -L 8080:localhost:80 u@h'}}}
  - {name: dynamic forward, should_match: false, event: {kind: process_start, fields: {cmdline: 'ssh -D 1080 u@h'}}}
  - {name: rsync over ssh, should_match: false, event: {kind: process_start, fields: {cmdline: 'rsync -avR src/ u@h:/dst/'}}}
  - {name: sshd, should_match: false, event: {kind: process_start, fields: {cmdline: '/usr/sbin/sshd -D -R'}}}
