id: D9b.ssh-peer-push
title: ssh/scp client started on a server toward another host
severity: medium
tier: 1
attack: [T1021.004, T1570]
collect: [process_tree]
exempt_tagged: true
when:
  event: process_start
  all:
    - comm: [ssh, scp, sftp, sshpass, rsync]
    - cmdline: {re: '\S+@[0-9A-Za-z.:-]+'}
    - not: {cgroup: {re: '(ansible|phylax)'}}
tests:
  - {name: scp to peer, should_match: true, event: {kind: process_start, fields: {comm: scp, cmdline: "scp a.txt root@10.0.0.5:/tmp", cgroup: "/user.slice/session-2.scope"}}}
  - {name: our own unit, should_match: false, event: {kind: process_start, fields: {comm: ssh, cmdline: "ssh phylax@10.0.0.2 true", cgroup: "/system.slice/phylax.service"}}}
  - {name: local ssh-keygen, should_match: false, event: {kind: process_start, fields: {comm: ssh-keygen, cmdline: "ssh-keygen -t ed25519"}}}
