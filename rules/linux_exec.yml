id: D1e.sshd-child-interpreter
title: Interpreter or network tool whose parent is sshd
severity: high
tier: 1
attack: [T1556.003, T1098.004]
collect: [process_tree]
exempt_tagged: true
when:
  event: process_start
  all:
    - parent.comm: sshd
    - comm: {re: '^(python[0-9.]*|perl|ruby|php|node|nc|ncat|socat|curl|wget)$'}
tests:
  - {name: python from sshd (PAM hook shape), should_match: true, event: {kind: process_start, fields: {comm: python3, pcomm: sshd}}}
  - {name: nested parent field, should_match: true, event: {kind: process_start, fields: {comm: curl, parent: {comm: sshd}}}}
  - {name: bash login shell is normal, should_match: false, event: {kind: process_start, fields: {comm: bash, pcomm: sshd}}}
  - {name: python from cron, should_match: false, event: {kind: process_start, fields: {comm: python3, pcomm: cron}}}
