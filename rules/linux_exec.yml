id: D11b.kmod-load
title: Kernel module loaded by command
severity: high
tier: 1
attack: [T1547.006, T1014]
collect: [process_tree]
exempt_tagged: true
when:
  event: process_start
  all:
    - comm: [insmod, modprobe, rmmod, kmod, depmod]
    - not: {cmdline: {re: '(nf_tables|nft_|xt_|nf_conntrack|br_netfilter|overlay|veth|vxlan|dm_|loop)'}}
tests:
  - {name: insmod rootkit, should_match: true, event: {kind: process_start, fields: {comm: insmod, cmdline: "insmod /tmp/diamorphine.ko"}}}
  - {name: docker's overlay, should_match: false, event: {kind: process_start, fields: {comm: modprobe, cmdline: "modprobe overlay"}}}
