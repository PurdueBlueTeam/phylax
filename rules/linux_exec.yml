id: D5c.setcap
title: setcap granting a powerful capability
severity: high
tier: 1
attack: [T1548, T1098]
collect: [process_tree]
exempt_tagged: true
when:
  event: process_start
  all:
    - comm: setcap
    - cmdline: {re: '(?i)cap_(setuid|setgid|dac_override|dac_read_search|sys_admin|sys_ptrace|sys_module|chown|fowner|net_admin)'}
tests:
  - {name: cap_setuid on python, should_match: true, event: {kind: process_start, fields: {comm: setcap, cmdline: "setcap cap_setuid+ep /usr/bin/python3"}}}
  - {name: harmless bind cap, should_match: false, event: {kind: process_start, fields: {comm: setcap, cmdline: "setcap cap_net_bind_service+ep /usr/bin/x"}}}
