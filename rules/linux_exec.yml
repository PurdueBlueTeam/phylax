id: D7d.uid0-account-cmd
title: Account utility invoked with an explicit uid of 0
severity: critical
tier: 1
attack: [T1136.001, T1098]
collect: [process_tree, content_changes]
exempt_tagged: true
when:
  event: process_start
  all:
    - comm: [useradd, usermod, adduser, newusers]
    - cmdline: {re: '(^|\s)(-u|--uid)[ =]0(\s|$)'}
tests:
  - {name: second root, should_match: true, event: {kind: process_start, fields: {comm: useradd, cmdline: "useradd -o -u 0 toor"}}}
  - {name: normal uid, should_match: false, event: {kind: process_start, fields: {comm: useradd, cmdline: "useradd -u 1001 bob"}}}
  - {name: uid 0x prefix is not 0, should_match: false, event: {kind: process_start, fields: {comm: useradd, cmdline: "useradd -u 1000 bob"}}}
