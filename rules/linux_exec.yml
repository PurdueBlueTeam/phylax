id: D3c.remote-access-inventory
title: Remote-access or tunnelling tool started
severity: high
tier: 1
attack: [T1219, T1572, T1090]
collect: [process_tree]
exempt_tagged: true
when:
  event: process_start
  all:
    - comm: {re: '(?i)^(tailscaled?|ngrok|chisel|frpc?|frps|ligolo.*|cloudflared|zerotier-one|rathole|wstunnel|sshuttle|bore|teamviewerd?|anydesk|rustdesk|x11vnc|Xtigervnc|Xvnc|vncserver|socat|ncat)$'}
tests:
  - {name: chisel, should_match: true, event: {kind: process_start, fields: {comm: chisel}}}
  - {name: socat, should_match: true, event: {kind: process_start, fields: {comm: socat}}}
  - {name: bash, should_match: false, event: {kind: process_start, fields: {comm: bash}}}
