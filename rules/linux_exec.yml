id: D7f.priv-group-add-cmd
title: User added to a privileged group by command line
severity: high
tier: 1
attack: [T1098, T1548.003]
collect: [process_tree]
exempt_tagged: true
when:
  event: process_start
  all:
    - comm: [usermod, gpasswd, adduser, useradd]
    - cmdline: {re: '(-[a-zA-Z]*G|--groups|gpasswd|adduser)'}
    - cmdline: {re: '(?i)\b(sudo|wheel|root|adm|docker|lxd|disk|shadow|admin)\b'}
tests:
  - {name: usermod sudo, should_match: true, event: {kind: process_start, fields: {comm: usermod, cmdline: "usermod -aG sudo bob"}}}
  - {name: gpasswd wheel, should_match: true, event: {kind: process_start, fields: {comm: gpasswd, cmdline: "gpasswd -a bob wheel"}}}
  - {name: plain group, should_match: false, event: {kind: process_start, fields: {comm: usermod, cmdline: "usermod -aG video bob"}}}
