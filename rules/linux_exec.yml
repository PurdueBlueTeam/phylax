id: D6f.immutable-flag
title: chattr sets or clears the immutable/append-only attribute outside a plan
description: Both directions (Sigma only detects removal). Our hardening runs chattr +i under a plan tag and is exempt.
severity: medium
tier: 1
attack: [T1222.002, T1070.004]
collect: [process_tree]
exempt_tagged: true
when:
  event: process_start
  all:
    - comm: chattr
    - cmdline: {re: '(^|\s)[-+=][a-zA-Z]*[ia]'}
tests:
  - {name: attacker sets +i on authorized_keys, should_match: true, event: {kind: process_start, fields: {comm: chattr, cmdline: "chattr +i /root/.ssh/authorized_keys"}}}
  - {name: attacker clears -i, should_match: true, event: {kind: process_start, fields: {comm: chattr, cmdline: "chattr -i /etc/passwd"}}}
  - {name: our hardening is tagged, should_match: false, event: {kind: process_start, fields: {comm: chattr, cmdline: "chattr +i /etc/passwd /etc/shadow", tag: "plan:harden-linux"}}}
  - {name: lsattr, should_match: false, event: {kind: process_start, fields: {comm: lsattr, cmdline: "lsattr /etc/passwd"}}}
