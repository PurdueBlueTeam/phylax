id: D5g.suid-set
title: chmod setting the setuid/setgid bit
severity: medium
tier: 1
attack: [T1548.001]
collect: [process_tree]
exempt_tagged: true
when:
  event: process_start
  all:
    - comm: chmod
    - cmdline: {re: '(^|\s)([ugoa]*\+[rwxXt]*s|[2467][0-7]{3})(\s|$)'}
tests:
  - {name: chmod u+s, should_match: true, event: {kind: process_start, fields: {comm: chmod, cmdline: "chmod u+s /bin/bash"}}}
  - {name: chmod 4755, should_match: true, event: {kind: process_start, fields: {comm: chmod, cmdline: "chmod 4755 /tmp/x"}}}
  - {name: chmod 755, should_match: false, event: {kind: process_start, fields: {comm: chmod, cmdline: "chmod 755 /tmp/x"}}}
