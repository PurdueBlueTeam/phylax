id: D6n.sched-exec
title: at/batch, crontab edit or systemd transient timer
severity: medium
tier: 1
attack: [T1053.003, T1053.002, T1053.006]
collect: [process_tree, content_changes]
exempt_tagged: true
when:
  event: process_start
  any:
    - comm: [at, batch]
    - all:
        - comm: crontab
        - cmdline: {re: '(\s-e(\s|$)|\s-u\s|\s[^-\s]\S*$)'}
    - all:
        - comm: systemd-run
        - cmdline: {re: '--on-(calendar|active|boot|startup|unit-active)'}
tests:
  - {name: crontab -e, should_match: true, event: {kind: process_start, fields: {comm: crontab, cmdline: "crontab -e"}}}
  - {name: at, should_match: true, event: {kind: process_start, fields: {comm: at, cmdline: "at now"}}}
  - {name: crontab -l is a read, should_match: false, event: {kind: process_start, fields: {comm: crontab, cmdline: "crontab -l"}}}
