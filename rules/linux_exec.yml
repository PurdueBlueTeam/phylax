id: D1f.web-server-child
title: Web-server unit started a shell, recon utility or download tool
severity: high
tier: 1
attack: [T1505.003, T1059.004]
collect: [process_tree, content_changes, transactions_window_10m, freeze_ring]
exempt_tagged: true
when:
  event: process_start
  all:
    - cgroup: {re: '(?i)(apache2?|httpd|nginx|lighttpd|php[0-9.]*-fpm|tomcat)'}
    - comm: [sh, bash, dash, zsh, ash, busybox, python, python2, python3, perl, ruby, nc, ncat, socat, curl, wget, whoami, id, uname, ifconfig, ip, netstat, ss, hostname, crontab, iptables, base64, mkfifo]
tests:
  - {name: whoami under apache, should_match: true, event: {kind: process_start, fields: {comm: whoami, cgroup: /system.slice/apache2.service}}}
  - {name: php-fpm spawns sh, should_match: true, event: {kind: process_start, fields: {comm: sh, cgroup: /system.slice/php8.1-fpm.service}}}
  - {name: apache2ctl in same unit is not a shell tool, should_match: false, event: {kind: process_start, fields: {comm: apache2, cgroup: /system.slice/apache2.service}}}
  - {name: shell in ssh session, should_match: false, event: {kind: process_start, fields: {comm: bash, cgroup: /user.slice/session-1.scope}}}
