id: D6c.pkg-hold
title: Package hold or versionlock command
severity: high
tier: 1
attack: [T1556.003, T1685]
collect: [process_tree]
exempt_tagged: true
when:
  event: process_start
  any:
    - all:
        - comm: apt-mark
        - cmdline: {re: '\bhold\b'}
    - all:
        - comm: dpkg
        - cmdline: {re: '--set-selections'}
    - all:
        - comm: [dnf, yum, dnf-3]
        - cmdline: {re: 'versionlock\s+(add|exclude)'}
tests:
  - {name: apt-mark hold, should_match: true, event: {kind: process_start, fields: {comm: apt-mark, cmdline: "apt-mark hold libpam-modules"}}}
  - {name: dnf versionlock, should_match: true, event: {kind: process_start, fields: {comm: dnf, cmdline: "dnf versionlock add pam"}}}
  - {name: apt-mark showhold is a read, should_match: false, event: {kind: process_start, fields: {comm: apt-mark, cmdline: "apt-mark showmanual"}}}
