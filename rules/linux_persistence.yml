id: D5f.binary-dir-write
title: Write into a system binary directory
severity: high
tier: 1
attack: [T1036.005, T1222.002]
collect: [process_tree, content_changes]
exempt_tagged: true
entities: [path, exe]
when:
  event: file_change
  all:
    - path: {re: '^/(usr/(local/)?)?(s?bin|libexec)/'}
    - op: [create, modify, rename, delete]
tests:
  - {name: binary replaced, should_match: true, event: {kind: file_change, fields: {path: /usr/sbin/postfix, op: modify, exe: /bin/cp}}}
  - {name: package manager in patch window, should_match: false, event: {kind: file_change, fields: {path: /usr/bin/ssh, op: modify, tag: "patch-window"}}}
  - {name: /usr/share untouched, should_match: false, event: {kind: file_change, fields: {path: /usr/share/doc/x, op: create}}}
