id: D10i.monitoring-config-change
title: Splunk/Wazuh/Cribl configuration or active-response script changed
severity: high
tier: 1
attack: [T1685, T1059, T1543]
collect: [content_changes, process_tree]
exempt_tagged: true
when:
  event: file_change
  all:
    - path: {re: '/splunk(forwarder)?/etc/(apps/[^/]+/(default|local)/(inputs|outputs|props|transforms|restmap|commands|alert_actions|savedsearches)\.conf|system/local/[^/]+\.conf|deployment-apps/.+)$|^/var/ossec/(etc/(ossec\.conf|shared/.+)|active-response/bin/.+)$|/cribl/(local|default)/.+'}
    - op: [create, modify, rename]
tests:
  - {name: scripted input, should_match: true, event: {kind: file_change, fields: {path: /opt/splunk/etc/apps/search/local/inputs.conf, op: modify}}}
  - {name: ossec.conf, should_match: true, event: {kind: file_change, fields: {path: /var/ossec/etc/ossec.conf, op: modify}}}
  - {name: splunk var data, should_match: false, event: {kind: file_change, fields: {path: /opt/splunk/var/lib/splunk/x, op: modify}}}
---
id: D2g.webroot-dangerous-ext
title: Executable or double-extension file appeared in a web content tree
severity: high
tier: 1
attack: [T1505.003, T1036.008]
collect: [content_changes, process_tree, transactions_window_10m]
exempt_tagged: true
entities: [path, exe]
when:
  event: file_change
  all:
    - path: {re: '^/(var/www|srv/(www|http)|usr/share/nginx|opt/lampp/htdocs)/'}
    - op: [create, rename]
    - path: {re: '(?i)\.(php[0-9]?|phtml|pht|phar|inc|aspx?|ashx|asmx|jsp[xf]?|cgi|pl)(\.[a-z0-9]{2,5})?$|\.(jpe?g|png|gif|ico|txt|css|js)\.(php[0-9]?|phtml|aspx?)$'}
tests:
  - {name: php dropped in uploads, should_match: true, event: {kind: file_change, fields: {path: /var/www/html/uploads/x.php, op: create}}}
  - {name: double extension, should_match: true, event: {kind: file_change, fields: {path: /var/www/html/img/a.jpg.php, op: create}}}
  - {name: deploy is tagged, should_match: false, event: {kind: file_change, fields: {path: /var/www/html/index.php, op: create, tag: "plan:deploy"}}}
  - {name: image upload, should_match: false, event: {kind: file_change, fields: {path: /var/www/html/uploads/a.jpg, op: create}}}
---
id: D2a.webroot-change
title: Untagged change to scored web content
description: Any untagged create/modify/delete/rename in a content root. Attaches the writer so the trace-back is immediate.
severity: medium
tier: 1
attack: [T1491.001, T1505.003]
collect: [content_changes, process_tree, transactions_window_10m]
exempt_tagged: true
entities: [path, exe]
when:
  event: file_change
  all:
    - path: {startswith_any: [/var/www/, /srv/www/, /usr/share/nginx/]}
    - op: [create, modify, rename, delete]
    - not: {path: {re: '\.(log|swp|tmp|cache|sock|pid)$'}}
    - not: {self_tamper: true}
tests:
  - {name: index defaced, should_match: true, event: {kind: file_change, fields: {path: /var/www/html/index.html, op: modify, exe: /usr/bin/vim}}}
  - {name: tagged deploy, should_match: false, event: {kind: file_change, fields: {path: /var/www/html/index.html, op: modify, tag: "plan:deploy"}}}
  - {name: cache file, should_match: false, event: {kind: file_change, fields: {path: /var/www/html/cache/a.tmp, op: create}}}
---
id: D17b.config-moved
title: Service config or content deleted or moved away
severity: high
tier: 1
attack: [T1485, T1489, T1070.004]
collect: [content_changes, process_tree]
exempt_tagged: true
entities: [path, old_path, exe]
when:
  event: file_change
  all:
    - any:
        - all:
            - op: delete
            - path: {re: '^/etc/(apache2|httpd|nginx|postfix|dovecot|bind|named|mysql|ssh)/|^/var/www/|^/srv/www/|^/etc/(named\.conf|my\.cnf|vsftpd\.conf|proftpd/)'}
        - all:
            - op: rename
            - old_path: {re: '^/etc/(apache2|httpd|nginx|postfix|dovecot|bind|named|mysql|ssh)/|^/var/www/|^/srv/www/|^/etc/(named\.conf|my\.cnf|vsftpd\.conf|proftpd/)'}
    - not: {path: {re: '(~|\.sw[a-p]|\.tmp|\.part|\.lock|\.pid|\.sock|\.cache)$'}}
tests:
  - {name: config deleted, should_match: true, event: {kind: file_change, fields: {path: /etc/nginx/nginx.conf, op: delete}}}
  - {name: config moved away, should_match: true, event: {kind: file_change, fields: {path: /root/x, old_path: /etc/postfix/main.cf, op: rename}}}
  - {name: editor swap file, should_match: false, event: {kind: file_change, fields: {path: /etc/nginx/.nginx.conf.swp, op: delete}}}
  - {name: unrelated delete, should_match: false, event: {kind: file_change, fields: {path: /tmp/a, op: delete}}}
---
id: D5h.agent-self-tamper
title: Phylax agent binary, unit or config touched by someone else
severity: critical
tier: 1
attack: [T1685]
collect: [process_tree, content_changes]
entities: [path, exe]
when:
  event: file_change
  all:
    - self_tamper: true
tests:
  - {name: agent binary replaced, should_match: true, event: {kind: file_change, fields: {path: /usr/local/bin/phylax, op: modify, self_tamper: true, exe: /bin/cp}}}
  - {name: ordinary file, should_match: false, event: {kind: file_change, fields: {path: /etc/hosts, op: modify}}}
