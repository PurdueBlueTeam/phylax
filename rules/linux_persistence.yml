id: D6l.systemd-generator-override
title: systemd generator, drop-in or non-service unit added
severity: high
tier: 1
attack: [T1543.002, T1037]
collect: [process_tree, content_changes]
exempt_tagged: true
when:
  event: file_change
  all:
    - path: {re: '^/(etc|usr/lib|usr/local/lib|run)/systemd/(system|user)-generators/|^/(etc|run)/systemd/(system|user)/[^/]+\.d/[^/]+\.conf$|^/(etc|usr/lib)/systemd/(system|user)/[^/]+\.(path|socket|mount|automount)$'}
    - op: [create, modify, rename]
tests:
  - {name: drop-in override, should_match: true, event: {kind: file_change, fields: {path: /etc/systemd/system/ssh.service.d/override.conf, op: create}}}
  - {name: generator, should_match: true, event: {kind: file_change, fields: {path: /etc/systemd/system-generators/evil, op: create}}}
  - {name: plain service unit is D6a, should_match: false, event: {kind: file_change, fields: {path: /etc/systemd/system/foo.service, op: create}}}
