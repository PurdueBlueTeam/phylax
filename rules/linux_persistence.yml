id: D6d.ld-so-preload-file
title: Dynamic loader preload or loader config changed
severity: critical
tier: 1
attack: [T1574.006]
collect: [process_tree, content_changes]
exempt_tagged: true
when:
  event: file_change
  all:
    - path: {re: '^/etc/ld\.so\.preload$|^/etc/ld\.so\.conf\.d/.+'}
    - op: [create, modify, rename]
tests:
  - {name: ld.so.preload created, should_match: true, event: {kind: file_change, fields: {path: /etc/ld.so.preload, op: create}}}
  - {name: ld.so.cache is regenerated by ldconfig, should_match: false, event: {kind: file_change, fields: {path: /etc/ld.so.cache, op: modify}}}
