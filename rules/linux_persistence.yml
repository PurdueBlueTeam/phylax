id: D2i.db-plugin-and-config
title: Database plugin, auth or config file changed
severity: high
tier: 1
attack: [T1505, T1098, T1556]
collect: [content_changes, process_tree]
exempt_tagged: true
when:
  event: file_change
  all:
    - path: {re: '^/usr/lib(64)?/(x86_64-linux-gnu/)?(mysql|mariadb)/plugin/.+\.so$|^/etc/(my\.cnf(\.d/.+)?|mysql/.+|postgresql/.+/(pg_hba|postgresql)\.conf)$|^/var/lib/pgsql/data/pg_hba\.conf$'}
    - op: [create, modify, rename]
tests:
  - {name: mysql plugin dropped, should_match: true, event: {kind: file_change, fields: {path: /usr/lib/mysql/plugin/udf.so, op: create}}}
  - {name: pg_hba, should_match: true, event: {kind: file_change, fields: {path: /etc/postgresql/14/main/pg_hba.conf, op: modify}}}
  - {name: datadir is not config, should_match: false, event: {kind: file_change, fields: {path: /var/lib/mysql/ibdata1, op: modify}}}
