id: D2h.mail-hooks
title: Postfix/Dovecot configuration or per-user mail hook changed
severity: high
tier: 1
attack: [T1546, T1114.003, T1098]
collect: [content_changes, process_tree]
exempt_tagged: true
when:
  event: file_change
  all:
    - path: {re: '^/etc/(postfix/[^/]+|aliases|dovecot/.+|mail/.+)$|(^|/)\.(forward|procmailrc|dovecot\.sieve|qmail)$|^/var/lib/dovecot/sieve/.+\.sieve$'}
    - not: {path: {re: '\.(db|lmdb|cache|lock)$'}}
    - op: [create, modify, rename, delete]
tests:
  - {name: master.cf pipe, should_match: true, event: {kind: file_change, fields: {path: /etc/postfix/master.cf, op: modify}}}
  - {name: .forward, should_match: true, event: {kind: file_change, fields: {path: /home/bob/.forward, op: create}}}
  - {name: postmap output, should_match: false, event: {kind: file_change, fields: {path: /etc/postfix/transport.db, op: modify}}}
