id: D6a.unit-or-cron-file
title: Service unit, timer or cron file written
severity: high
tier: 1
attack: [T1543.002, T1053.003, T1053.006]
collect: [process_tree, content_changes]
exempt_tagged: true
entities: [path, exe]
when:
  event: file_change
  all:
    - path: {re: '^/(etc|usr/lib|lib)/systemd/system/[^/]+\.(service|timer)$|^/etc/(cron\.(d|hourly|daily|weekly|monthly)/.+|crontab|anacrontab)$|^/var/spool/cron(/crontabs)?/.+|^/var/spool/at/.+'}
    - op: [create, modify, rename]
tests:
  - {name: new timer, should_match: true, event: {kind: file_change, fields: {path: /etc/systemd/system/update.timer, op: create}}}
  - {name: cron.d, should_match: true, event: {kind: file_change, fields: {path: /etc/cron.d/x, op: create}}}
  - {name: crontab tagged, should_match: false, event: {kind: file_change, fields: {path: /etc/crontab, op: modify, tag: "plan:p2"}}}
  - {name: cron.deny is not a job, should_match: false, event: {kind: file_change, fields: {path: /etc/cron.deny, op: modify}}}
