id: D6e.shell-hook-files
title: Login or shell hook file changed
severity: high
tier: 1
attack: [T1546.004, T1037.004, T1547.013]
collect: [process_tree, content_changes]
exempt_tagged: true
when:
  event: file_change
  all:
    - path: {re: '^/etc/(profile|bash\.bashrc|bashrc|environment|inputrc|zsh/[^/]+|csh\.(cshrc|login)|profile\.d/.+|bash_completion\.d/.+|update-motd\.d/.+|xdg/autostart/.+)$|^/(root|home/[^/]+)/\.(bashrc|bash_profile|bash_login|bash_logout|profile|zshrc|zprofile|screenrc|tmux\.conf|vimrc|inputrc|config/autostart/.+)$'}
    - op: [create, modify, rename]
tests:
  - {name: bashrc, should_match: true, event: {kind: file_change, fields: {path: /home/azul/.bashrc, op: modify}}}
  - {name: profile.d script, should_match: true, event: {kind: file_change, fields: {path: /etc/profile.d/x.sh, op: create}}}
  - {name: bash_history is not a hook, should_match: false, event: {kind: file_change, fields: {path: /home/azul/.bash_history, op: modify}}}
