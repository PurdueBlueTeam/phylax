# Linux file-change rules (producer: internal/collect/audit file_change; ops are
# create, modify, rename, delete, attr; path is the new name on rename, old_path the old).
# Events carrying a Phylax plan/patch-window tag are exempt (exempt_tagged).
id: D6h.ssh-persistence-files
title: SSH key or sshd persistence file changed outside a plan
severity: high
tier: 1
attack: [T1098.004, T1021.004, T1556]
collect: [process_tree, content_changes]
exempt_tagged: true
entities: [path, exe]
message: "{path} {op} by {exe}"
when:
  event: file_change
  all:
    - path: {re: '(^|/)\.ssh/(authorized_keys2?|rc|environment)$|^/etc/ssh/(sshrc|sshd_config|ssh_config)(\.d/[^/]+)?$'}
    - op: [create, modify, rename, delete]
tests:
  - {name: authorized_keys edited, should_match: true, event: {kind: file_change, fields: {path: /home/azul/.ssh/authorized_keys, op: modify, exe: /usr/bin/vim.basic}}}
  - {name: sshd_config.d drop-in, should_match: true, event: {kind: file_change, fields: {path: /etc/ssh/sshd_config.d/10-x.conf, op: create}}}
  - {name: our hardening is tagged, should_match: false, event: {kind: file_change, fields: {path: /etc/ssh/sshd_config, op: modify, tag: "plan:harden-ssh"}}}
  - {name: known_hosts is not persistence, should_match: false, event: {kind: file_change, fields: {path: /home/azul/.ssh/known_hosts, op: modify}}}
---
id: D7b.sudoers-change
title: sudoers or sudoers.d changed outside a plan
severity: high
tier: 1
attack: [T1548.003, T1098]
collect: [process_tree, content_changes]
exempt_tagged: true
entities: [path, exe]
when:
  event: file_change
  all:
    - path: {re: '^/etc/sudoers(\.d/.+|\.tmp)?$'}
    - op: [create, modify, rename, delete]
tests:
  - {name: sudoers.d drop-in, should_match: true, event: {kind: file_change, fields: {path: /etc/sudoers.d/backdoor, op: create}}}
  - {name: visudo tmp rename, should_match: true, event: {kind: file_change, fields: {path: /etc/sudoers, old_path: /etc/sudoers.tmp, op: rename}}}
  - {name: tagged plan step, should_match: false, event: {kind: file_change, fields: {path: /etc/sudoers, op: modify, tag: "plan:p1"}}}
  - {name: sudo.conf is different, should_match: false, event: {kind: file_change, fields: {path: /etc/sudo.conf, op: modify}}}
---
id: D7a.passwd-shadow-change
title: Account database file changed outside a plan
description: /etc/passwd, shadow, group, gshadow written by anything other than a tagged plan step. Our own chattr +i hardening produces no write; useradd/passwd by an operator is tier 1 so it costs one click.
severity: high
tier: 1
attack: [T1136.001, T1098, T1078.003]
collect: [process_tree, content_changes]
exempt_tagged: true
entities: [path, exe]
when:
  event: file_change
  all:
    - path: {re: '^/etc/(passwd|shadow|group|gshadow|passwd-|shadow-)$|^/etc/(passwd|shadow|group|gshadow)\.(tmp|new|lock)$'}
    - op: [create, modify, rename, delete]
tests:
  - {name: passwd rewritten by useradd, should_match: true, event: {kind: file_change, fields: {path: /etc/passwd, op: rename, old_path: /etc/passwd+, exe: /usr/sbin/useradd}}}
  - {name: tagged, should_match: false, event: {kind: file_change, fields: {path: /etc/shadow, op: modify, tag: "plan:rotate"}}}
  - {name: nsswitch, should_match: false, event: {kind: file_change, fields: {path: /etc/nsswitch.conf, op: modify}}}
---
id: D6c2.pkg-pin-file
title: Package pin or versionlock file changed
severity: high
tier: 1
attack: [T1556.003]
collect: [content_changes]
exempt_tagged: true
when:
  event: file_change
  all:
    - path: {re: '^/etc/(apt/preferences(\.d/.+)?|dnf/plugins/versionlock\.(list|conf)|yum/pluginconf\.d/versionlock\.list)$'}
    - op: [create, modify, rename]
tests:
  - {name: apt preferences pin, should_match: true, event: {kind: file_change, fields: {path: /etc/apt/preferences.d/pam, op: create}}}
  - {name: sources.list is not a pin, should_match: false, event: {kind: file_change, fields: {path: /etc/apt/sources.list, op: modify}}}
---
id: D6i.pam-change
title: PAM module or configuration changed
severity: critical
tier: 1
attack: [T1556.003]
collect: [process_tree, content_changes]
exempt_tagged: true
entities: [path, exe]
when:
  event: file_change
  all:
    - path: {re: '^/etc/pam\.d/|^/etc/pam\.conf$|^/etc/security/|^/(usr/)?lib(64)?/(x86_64-linux-gnu/|aarch64-linux-gnu/)?security/'}
    - op: [create, modify, rename, delete]
tests:
  - {name: pam_unix.so replaced, should_match: true, event: {kind: file_change, fields: {path: /lib/x86_64-linux-gnu/security/pam_unix.so, op: modify}}}
  - {name: sshd pam config, should_match: true, event: {kind: file_change, fields: {path: /etc/pam.d/sshd, op: modify}}}
  - {name: patch window, should_match: false, event: {kind: file_change, fields: {path: /lib/x86_64-linux-gnu/security/pam_unix.so, op: modify, tag: "patch-window"}}}
  - {name: unrelated lib, should_match: false, event: {kind: file_change, fields: {path: /usr/lib/x86_64-linux-gnu/libc.so.6, op: modify}}}
