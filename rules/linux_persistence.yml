id: D11b2.kmod-file
title: Kernel module file or module-load config written
severity: high
tier: 1
attack: [T1547.006]
collect: [content_changes]
exempt_tagged: true
when:
  event: file_change
  all:
    - path: {re: '\.ko(\.[gx]z|\.zst)?$|^/etc/(modules-load\.d|modprobe\.d)/.+|^/etc/modules$'}
    - op: [create, modify, rename]
tests:
  - {name: dropped ko, should_match: true, event: {kind: file_change, fields: {path: /tmp/diamorphine.ko, op: create}}}
  - {name: modules-load.d, should_match: true, event: {kind: file_change, fields: {path: /etc/modules-load.d/x.conf, op: create}}}
  - {name: unrelated, should_match: false, event: {kind: file_change, fields: {path: /tmp/token.kos, op: create}}}
---
id: D6o.hook-dirs
title: apt/dnf/udev/logrotate/rc hook directory changed
severity: high
tier: 1
attack: [T1546.016, T1037.004, T1546.017, T1053]
collect: [process_tree, content_changes]
exempt_tagged: true
when:
  event: file_change
  all:
    - path: {re: '^/etc/(apt/apt\.conf\.d/.+|dnf/plugins/.+|yum/pluginconf\.d/.+|udev/rules\.d/.+|logrotate\.d/.+|rc\.local|rc\.common|init\.d/.+|rc[0-6S]\.d/.+|dracut\.conf\.d/.+)$|^/(usr/lib|lib)/udev/rules\.d/.+|^/usr/lib/dracut/modules\.d/.+'}
    - op: [create, modify, rename]
tests:
  - {name: apt hook, should_match: true, event: {kind: file_change, fields: {path: /etc/apt/apt.conf.d/99x, op: create}}}
  - {name: rc.local, should_match: true, event: {kind: file_change, fields: {path: /etc/rc.local, op: modify}}}
  - {name: patch window, should_match: false, event: {kind: file_change, fields: {path: /etc/logrotate.d/apache2, op: modify, tag: "patch-window"}}}
