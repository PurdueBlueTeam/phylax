# Action specs the plan templates use that the agent action catalog
# (internal/actions) does not yet implement. Data only: they let templates
# validate against internal/plan today. Each is a TODO until the agent ships
# the implementation; see docs/integrations.md "Missing actions".
# params: name -> {required: bool}. Unknown params are rejected.
actions:
  pkg.install:
    risk: service
    locks: [packages]
    todo: install from the local depot cache only, verify sha256, never download
    params: {name: {required: true}, version: {}, source: {}, sha256: {}}
  pkg.remove:
    risk: service
    locks: [packages]
    todo: remove package, keep config
    params: {name: {required: true}}
  firewall.allow:
    risk: lockout
    locks: [firewall]
    todo: host firewall rule with dead-man rollback
    params: {ports: {required: true}, proto: {}, from: {required: true}, name: {}}
  ini.set:
    risk: service
    todo: set key in a conf stanza atomically (Splunk .conf, ossec-style)
    params: {path: {required: true}, stanza: {required: true}, key: {required: true}, value: {required: true}}
  xml.set:
    risk: service
    todo: set element text at an xpath (Wazuh ossec.conf)
    params: {path: {required: true}, xpath: {required: true}, value: {required: true}}
  registry.set:
    risk: service
    todo: Windows registry value with prior-value capture
    params: {key: {required: true}, name: {required: true}, type: {required: true}, value: {required: true}}
  windows.smb1:
    risk: service
    todo: disable SMBv1 server and client
    params: {enabled: {required: true}}
  ad.secure_channel:
    risk: lockout
    todo: enforce Netlogon FullSecureChannelProtection=1 (Zerologon), report build and patch level
    params: {enforce: {required: true}, report_only: {}}
  ad.zerologon_check:
    risk: none
    todo: read-only build and registry check for CVE-2020-1472
    params: {}
  windows.hotfix:
    risk: service
    locks: [packages]
    todo: apply cached MSU; needs reboot, DNS and WinRM briefly down
    params: {kb: {required: true}, reboot: {}}
  palo.permitted_ips:
    risk: lockout
    todo: additive permitted-IP entry, commit alone (no commit-confirm on PAN-OS)
    params: {add: {required: true}, remove: {}}
  palo.commit:
    risk: lockout
    todo: management-path commit, verified with a new connection
    params: {description: {}}
  splunk.rest:
    risk: none
    todo: read-only splunkd REST (apps, inputs, users) for review
    params: {path: {required: true}}
  splunk.password:
    risk: lockout
    todo: change a Splunk local user's password, keep the scored user
    params: {user: {required: true}, password: {}}
  splunk.hec_setup:
    risk: service
    todo: create HEC token and phylax index without touching scored indexes
    params: {index: {required: true}, token_name: {required: true}}
  web.remove_dir:
    risk: service
    todo: move a directory to quarantine (never delete)
    params: {path: {required: true}}
  web.rename_dir:
    risk: service
    todo: rename a directory and fix references
    params: {path: {required: true}, to: {required: true}}
  kernel.module_block:
    risk: service
    todo: write modprobe blacklist and unload
    params: {module: {required: true}}
  sysctl.set:
    risk: service
    todo: set and persist a sysctl
    params: {key: {required: true}, value: {required: true}}
  command.check:
    risk: none
    todo: run an allowlisted read-only version/config probe (e.g. sudo -V)
    params: {probe: {required: true}}
  sql.query:
    risk: service
    todo: parameterised admin query against the local DB
    params: {engine: {required: true}, statement: {required: true}}
  net.http_probe:
    risk: none
    todo: HTTP GET and assert status/body regex (probe)
    params: {url: {required: true}, expect_status: {}, expect_regex: {}, insecure: {}}
  net.tcp_probe:
    risk: none
    todo: TCP connect assert
    params: {host: {required: true}, port: {required: true}}
  wazuh.health:
    risk: none
    todo: run the Wazuh API health check from internal/integrations/wazuh
    params: {api: {required: true}, min_version: {}}
  wazuh.capture:
    risk: none
    todo: write agent list, groups and test alert to the inject kit
    params: {api: {required: true}, out: {required: true}}
  wazuh.test_alert:
    risk: none
    todo: write a marker line to a monitored log so a test alert fires
    params: {path: {required: true}, marker: {required: true}}
  vyos.snapshot:
    risk: none
    todo: show configuration commands to evidence
    params: {out: {required: true}}
  agentopt.set:
    risk: service
    todo: write key=value lines to a Windows/Linux local_internal_options.conf atomically (file.write only validates POSIX paths on the controller)
    params: {path: {required: true}, keys: {required: true}}
