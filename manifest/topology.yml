# Reference manifest: 2026 Midwest regional shape.
#
# Two segments behind their own Palos, NAT between segments and the outside.
# The controller (ubuntu-wkst) lives in the linux segment; the windows
# segment reaches it through the relay (win11-wkst) and a static inbound NAT
# on palo1 for the controller's public address.
#
# The public address pool is 172.25.{{ 20 + team }}.0/24.

controller:
  host: ubuntu-wkst
  agent_port: 7443
  ui: 127.0.0.1:8443

segments:
  linux:
    cidr: 172.20.242.0/24
    firewall: palo1
    # controller lives here: agents dial it directly
  windows:
    cidr: 172.20.240.0/24
    firewall: palo2
    relay: { host: win11-wkst, port: 7444 }
    nat:
      relay_public: "172.25.{{ 20 + team }}.144"
      controller_public: "172.25.{{ 20 + team }}.200"

# Encrypted controller state snapshots go to the relay host.
backups:
  - win11-wkst
