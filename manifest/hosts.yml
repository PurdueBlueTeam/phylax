team: 12

hosts:
  ubuntu-wkst:
    segment: linux
    ip: 172.20.242.10
    os: { family: debian, distro: ubuntu, version: "24.04" }
    default_creds: defaults.ubuntu-wkst
    roles: [capture, check_runner]
  ubuntu-ecom:
    segment: linux
    ip: 172.20.242.30
    public_ip: "172.25.{{ 20 + team }}.11"
    os: { family: debian, distro: ubuntu, version: "24.04" }
    default_creds: defaults.ubuntu-ecom
    roles: [capture, decoys, check_runner]
  fedora-webmail:
    segment: linux
    ip: 172.20.242.40
    public_ip: "172.25.{{ 20 + team }}.12"
    os: { family: redhat, distro: fedora, version: "41" }
    default_creds: defaults.fedora-webmail
    roles: [capture, decoys, check_runner]
  oracle-splunk:
    segment: linux
    ip: 172.20.242.50
    os: { family: redhat, distro: oracle, version: "9" }
    default_creds: defaults.oracle-splunk
    roles: [capture]
  win11-wkst:
    segment: windows
    ip: 172.20.240.100
    os: { family: windows, version: "11-24h2" }
    default_creds: defaults.win11-wkst
    roles: [relay, device_proxy, check_runner, capture]
  server-ad-dns:
    segment: windows
    ip: 172.20.240.20
    public_ip: "172.25.{{ 20 + team }}.13"
    os: { family: windows, version: "2022" }
    default_creds: defaults.server-ad-dns
    roles: [check_runner]
