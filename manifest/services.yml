services:
  ecom-http:
    host: ubuntu-ecom
    kind: http
    scored: true
    listen: [{ proto: tcp, port: 80 }]
    process: { unit: apache2.service }
    content:
      roots: [/var/www/html]
      upload_dirs: [/var/www/html/image/catalog]
      normalize: [opencart_token, csrf, session_cookie, timestamps]
    data:
      - { kind: mysql, database: opencart }
      - { kind: dir, path: /var/www/html/image }
    depends_on:
      - { service: ecom-mysql }
      - { egress: dns, to: server-ad-dns }
    health:
      - { http_get: { path: "/", expect_status: 200, track_content: true } }

  ecom-mysql:
    host: ubuntu-ecom
    kind: mysql
    scored: false
    listen: [{ proto: tcp, port: 3306 }]
    process: { unit: mysql.service }

  ecom-ftp:
    host: ubuntu-ecom
    kind: ftp
    scored: true
    listen: [{ proto: tcp, port: 21 }]
    process: { unit: vsftpd.service }
    content:
      roots: [/srv/ftp/pub]
    health:
      - { ftp_list: { path: "/pub", file: "readme.txt" } }

  ecom-ntp:
    host: ubuntu-ecom
    kind: ntp
    scored: false
    listen: [{ proto: udp, port: 123 }]
    process: { unit: chronyd.service }

  ecom-tftp:
    host: ubuntu-ecom
    kind: tftp
    scored: false
    listen: [{ proto: udp, port: 69 }]
    process: { unit: tftpd-hpa.service }

  ecom-ssh:
    host: ubuntu-ecom
    kind: ssh
    scored: false
    state: enabled
    listen: [{ proto: tcp, port: 22 }]
    process: { unit: ssh.service }

  webmail-pop3:
    host: fedora-webmail
    kind: pop3
    scored: true
    listen: [{ proto: tcp, port: 110 }]
    process: { unit: dovecot.service }
    depends_on:
      - { egress: ldap, to: server-ad-dns, ports: [389] }
      - { egress: kerberos, to: server-ad-dns, ports: [88] }
      - { egress: dns, to: server-ad-dns }
    health:
      - { pop3_login: { account: health.pop3, expect: "+OK" } }

  webmail-smtp:
    host: fedora-webmail
    kind: smtp
    scored: true
    listen: [{ proto: tcp, port: 25 }]
    process: { unit: postfix.service }
    depends_on:
      - { egress: dns, to: server-ad-dns }

  webmail-ssh:
    host: fedora-webmail
    kind: ssh
    scored: false
    state: enabled
    listen: [{ proto: tcp, port: 22 }]
    process: { unit: sshd.service }

  ad-dns:
    host: server-ad-dns
    kind: dns
    scored: true
    listen:
      - { proto: udp, port: 53 }
      - { proto: tcp, port: 53 }
    process: { unit: dnsmgmt }
    health:
      - { dns_query: { name: "ecom.internal", expect: ["172.20.242.30"] } }

  ad-kerberos:
    host: server-ad-dns
    kind: kerberos
    scored: true
    listen:
      - { proto: udp, port: 88 }
      - { proto: tcp, port: 88 }

  ad-ldap:
    host: server-ad-dns
    kind: ldap
    scored: false
    listen: [{ proto: tcp, port: 389 }]

  splunk-hec:
    host: oracle-splunk
    kind: splunk
    scored: false
    listen: [{ proto: tcp, port: 8089 }]
    process: { unit: splunkd.service }
    health:
      - { tcp_banner: { port: 8089, matches: "HTTP/1\\." } }
