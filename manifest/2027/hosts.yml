# 2027 reference manifest: hosts.
hosts:
  rocky-ecom:      { segment: lan, ip: 172.20.240.10,  public: "172.25.{{ 20 + team }}.10",  os: { family: rhel,    distro: rocky,   version: "9" },      roles: [capture, decoys], default_credentials: host.default }
  ubuntu-email:    { segment: lan, ip: 172.20.240.15,  public: "172.25.{{ 20 + team }}.15",  os: { family: debian, distro: ubuntu,  version: "22.04" },  roles: [capture, decoys], default_credentials: host.default }
  debian-splunk:   { segment: lan, ip: 172.20.240.20,  public: "172.25.{{ 20 + team }}.20",  os: { family: debian, distro: debian,  version: "12" },     roles: [capture, decoys], default_credentials: host.default }
  ad:              { segment: lan, ip: 172.20.240.100, public: "172.25.{{ 20 + team }}.100", os: { family: windows, version: "server-2022" },           roles: [capture, check_runner], default_credentials: host.default }
  mssql:           { segment: lan, ip: 172.20.240.120, public: "172.25.{{ 20 + team }}.120", os: { family: windows, version: "server-2019" },           roles: [capture, decoys], default_credentials: host.default }
  ubuntu-wkst:     { segment: lan, ip: dhcp, class: workstation, os: { family: debian, distro: ubuntu, version: "22.04" }, roles: [controller, capture, check_runner] }
  win11-wkst:      { segment: lan, ip: dhcp, class: workstation, os: { family: windows, version: "11" },                    roles: [capture] }
  kali:            { segment: kali_leg, ip: 172.17.0.2, class: workstation, os: { family: debian, distro: kali, version: "2026.2" }, roles: [check_runner, scanner, canary] }
